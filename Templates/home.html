<!DOCTYPE html>
<html>
    <head>
        <title>
        {% if title %}
            Anime Blog - {{ title }}
        {% else %}
            Anime Blog
        {% endif %}
        </title>
    </head>
    <body>
        <h1>Home Page</h1>

        {% for post in posts %}
            <h2>{{ post["title"] }}</h2>
            <p>{{ post["content"] }}</p>
        {% endfor %}
    </body>
</html>
